<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Python Core Tutor</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar" aria-label="Python course modules">
      <div class="brand">
        <div class="brand-mark" aria-hidden="true">Py</div>
        <div>
          <h1>Python Core Tutor</h1>
          <p>Scratch to projects</p>
        </div>
      </div>

      <div class="progress-wrap" aria-label="Course progress">
        <div class="progress-copy">
          <span>Learning path</span>
          <strong id="progressText">0 of 0 done</strong>
        </div>
        <div class="progress-track">
          <div class="progress-bar" id="progressBar"></div>
        </div>
      </div>

      <nav class="module-list" id="moduleList"></nav>
    </aside>

    <main class="workspace">
      <section class="hero-panel">
        <div class="hero-copy">
          <span class="eyebrow" id="moduleNumber">Module 01</span>
          <h2 id="moduleTitle">Python Basics</h2>
          <p id="moduleGoal">Build a steady foundation before moving ahead.</p>
        </div>
        <div class="python-visual" aria-label="Python learning flow visualization">
          <canvas id="flowCanvas" width="420" height="180"></canvas>
          <div class="visual-badge">
            <span id="lessonCount">0</span>
            <small>lessons</small>
          </div>
        </div>
      </section>

      <section class="content-grid">
        <article class="lesson-panel">
          <div class="panel-head">
            <div>
              <span class="eyebrow">Concept</span>
              <h3 id="lessonTitle">Start here</h3>
            </div>
            <button class="icon-button" id="markDoneBtn" type="button" title="Mark module complete" aria-label="Mark module complete">
              <span aria-hidden="true">✓</span>
            </button>
          </div>
          <div class="lesson-body" id="lessonBody"></div>
        </article>

        <aside class="practice-panel">
          <div class="tabs" role="tablist" aria-label="Practice views">
            <button class="tab active" type="button" data-tab="example">Example</button>
            <button class="tab" type="button" data-tab="practice">Practice</button>
            <button class="tab" type="button" data-tab="project">Project</button>
          </div>

          <div class="tab-view active" id="exampleView">
            <div class="code-toolbar">
              <span>Example program</span>
              <button id="copyCodeBtn" class="small-button" type="button">Copy</button>
            </div>
            <pre><code id="codeBlock"></code></pre>
            <div class="output-box">
              <span>Expected output</span>
              <code id="outputBlock"></code>
            </div>
          </div>

          <div class="tab-view" id="practiceView">
            <h3>Practice set</h3>
            <ul class="task-list" id="practiceList"></ul>
          </div>

          <div class="tab-view" id="projectView">
            <h3 id="projectTitle">Mini project</h3>
            <p id="projectDescription"></p>
            <div class="project-checks" id="projectChecks"></div>
          </div>
        </aside>
      </section>
    </main>
  </div>

  <script src="app.js"></script>
</body>
</html>
